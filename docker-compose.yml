services:
  postgres:
    image: postgres:16-alpine
    container_name: termax-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - termax_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-termax_user} -d $${POSTGRES_DB:-termax_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  termax_pgdata:
